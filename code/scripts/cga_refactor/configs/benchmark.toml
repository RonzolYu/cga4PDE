# The exact formal values are materialized by config_for(..., profile="formal").
# This file records the immutable shared problem settings.
model = "linear"
dim = 1
seed = 201
p = 4.0
relu_power = 3
target_accepted = 256
phase = "formal"
dtype = "float64"
output_root = "cga_refactor/results"
freeze_profile = "neumann-cga-v1"
schema_version = "cga-refactor-1"

[pool]
candidate_size = 2048
reference_size = 4096
candidate_batch_size = 256
reference_batch_size = 256
sampler = "stratified_breakpoint"
sobol_fraction = 0.75
crossing_fraction = 0.90
anchor_padding = 0.05

[quadrature]
train_cells_2d = 40
train_order = 3
validation_sobol_power = 16
audit_sobol_power = 18
train_order_1d = 6
validation_order_1d = 10
audit_order_1d = 14
min_segment_width = 1e-10

[solver]
max_attempt_multiplier = 3
scale_atol = 1e-14
scale_rtol = 1e-12
innovation_atol = 1e-12
innovation_rtol = 1e-10
rank_atol = 1e-12
rank_rtol = 1e-10
score_atol = 1e-13
score_rtol = 1e-10
oracle_ratio_floor = 0.5
oracle_patience = 8
projection_atol = 1e-11
projection_rtol = 1e-10
max_lbfgs_iterations = 400
max_newton_iterations = 100
validation_gap_atol = 1e-10
validation_gap_rtol = 0.02
quadrature_warning_patience = 3
checkpoint_every_attempts = 1
