# Methods 1, 2, and 4A: one-seed formal rerun for exp0822.
model = "linear"
dim = 1
seed = 201
p = 4.0
relu_power = 3
exact_profile = "multifrequency"
quadrature_level = "Q2"
target_accepted = 256
phase = "formal_fix124a"
dtype = "float64"
output_root = "cga_refactor/results"
freeze_profile = "neumann-cga-v1-fix124a"
schema_version = "cga-refactor-2"

[pool]
candidate_size = 2048
reference_size = 4096
candidate_batch_size = 256
reference_batch_size = 256
sampler = "stratified_breakpoint"
sobol_fraction = 0.75
crossing_fraction = 0.90
anchor_padding = 0.05

[quadrature]
train_cells_2d = 64
train_order = 3
validation_sobol_power = 17
audit_sobol_power = 19
train_order_1d = 6
validation_order_1d = 10
audit_order_1d = 14
min_segment_width = 1e-10

[solver]
max_attempt_multiplier = 3
scale_atol = 1e-14
scale_rtol = 1e-12
innovation_atol = 1e-12
innovation_rtol = 1e-10
rank_atol = 1e-12
rank_rtol = 1e-10
score_atol = 1e-13
score_rtol = 1e-10
oracle_ratio_floor = 0.5
oracle_patience = 8
projection_atol = 1e-11
projection_rtol = 1e-10
max_lbfgs_iterations = 400
max_newton_iterations = 100
validation_gap_atol = 1e-10
validation_gap_rtol = 0.02
validation_increase_atol = 1e-10
energy_drop_scale_floor = 1e-12
quadrature_warning_patience = 3
audit_energy_gap_atol = 1e-10
audit_metric_atol = 1e-12
audit_rtol = 0.02
checkpoint_every_attempts = 1
